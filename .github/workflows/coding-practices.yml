name: Coding Practices

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review]
    branches: ["*"]

jobs:
  changes:
    runs-on: ubuntu-24.04
    # Required to expose outputs to dependent jobs (unused-dependencies, licenses-compatibility)
    outputs:
      crates: ${{ steps.changes.outputs.crates }}
      dependencies: ${{ steps.changes.outputs.dependencies }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            crates:
              - "crates/**"
            dependencies:
              - "Cargo.toml"
              - "Cargo.lock"
              - "crates/**/Cargo.toml"
              - "crates/**/Cargo.lock"

  changelog:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.crates == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate changelog updates
        id: validate
        continue-on-error: true
        run: python3 scripts/check-changelog --report-file changelog-check-report.md
      - name: Synchronize PR changelog comment
        if: always()
        uses: actions/github-script@v8
        env:
          CHANGELOG_CHECK_OUTCOME: ${{ steps.validate.outcome }}
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- amaru:changelog-check -->';
            const reportPath = 'changelog-check-report.md';
            const outcome = process.env.CHANGELOG_CHECK_OUTCOME;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (outcome === 'success') {
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                });
              }
              return;
            }

            const report = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8').trim()
              : '## Changelog check failed\n\nSee the workflow run for details.';

            const body = `${marker}\n${report}`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
      - name: Fail on changelog validation errors
        if: steps.validate.outcome != 'success'
        run: exit 1
